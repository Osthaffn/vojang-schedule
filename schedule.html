<style>
.vj-cal *,.vj-pop *{box-sizing:border-box}
body{margin:0;background:#fff;color:#1e1e1e}
.vj-cal{margin:0 auto;padding:1rem;max-width:62rem;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1e1e1e}
.vj-bar{display:flex;align-items:center;justify-content:center;gap:1rem;margin:0 0 .5rem}
.vj-title{font-size:1.3rem;font-weight:500;margin:0;min-width:11rem;text-align:center}
.vj-nav{font:inherit;font-size:1.4rem;line-height:1;width:2.2rem;height:2.2rem;border:1px solid #d8d8d8;border-radius:50%;background:#fff;color:#555;cursor:pointer}
.vj-nav:hover{background:#f0f0f0}
.vj-nav[disabled]{opacity:.25;cursor:default}
.vj-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.vj-hd{font-size:.8rem;color:#787878;padding:.2rem;text-align:center}
.vj-day{min-height:5rem;padding:0;display:flex;flex-direction:column}
.vj-day.vj-pad{border:0!important;min-height:0}
.vj-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:1px 3px;font-size:.75rem;line-height:1.15}
.vj-n{color:#1e1e1e}
.vj-mk{font-weight:600;padding-left:.15rem}
.vj-bf{position:relative;flex:1;margin:0 1px 1px}
.vj-b{position:absolute;border:0;padding:0;margin:0;font:inherit;cursor:pointer;border-radius:1px}
.vj-b.vj-off{opacity:.45}
.vj-legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:.9rem;font-size:.8rem;color:#555;align-items:center}
.vj-key{display:inline-flex;align-items:center;gap:.35rem}
.vj-key i{width:.85rem;height:.85rem;display:inline-block;border-radius:2px}
.vj-foot{margin-top:.5rem;font-size:.78rem;color:#787878}
.vj-pop[hidden]{display:none}
.vj-pop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9999}
.vj-card{background:#fff;color:#1e1e1e;border-radius:10px;padding:1.1rem 1.25rem;max-width:22rem;width:100%;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.vj-card h3{margin:0 0 .5rem;font-size:1.1rem}
.vj-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.2rem .75rem;font-size:.9rem}
.vj-card dt{color:#787878}
.vj-card dd{margin:0}
.vj-close{margin-top:.9rem;font:inherit;padding:.4rem .9rem;border-radius:6px;border:1px solid #d8d8d8;background:#f6f6f6;color:inherit;cursor:pointer}
@media (max-width:560px){
.vj-cal{padding:.4rem}
.vj-day{min-height:3.6rem}
.vj-hdr{font-size:.65rem}
.vj-hd{font-size:.7rem}
}

<script>
(function(){
var ms=[].slice.call(document.querySelectorAll('.vj-month'));
if(!ms.length)return;
var i=0;
for(var k=0;k<ms.length;k++){if(!ms[k].hidden){i=k;break}}
var t=document.getElementById('vj-title');
var navs=[].slice.call(document.querySelectorAll('.vj-nav'));
function show(n){
i=Math.max(0,Math.min(ms.length-1,n));
ms.forEach(function(m,k){m.hidden=(k!==i)});
t.textContent=ms[i].getAttribute('data-vj-label')||'';
navs.forEach(function(b){
var s=parseInt(b.getAttribute('data-vj-step'),10);
b.disabled=(i+s<0||i+s>ms.length-1);
});
}
navs.forEach(function(b){b.addEventListener('click',function(){
show(i+parseInt(b.getAttribute('data-vj-step'),10));
})});
show(i);
var pop=document.getElementById('vj-pop');
function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v||'\u2014'}
document.addEventListener('click',function(e){
var s=e.target.closest?e.target.closest('.vj-b'):null;
if(s){
set('vj-pop-name',s.getAttribute('data-vj-name'));
set('vj-pop-when',s.getAttribute('data-vj-when'));
set('vj-pop-time',s.getAttribute('data-vj-time'));
set('vj-pop-who',s.getAttribute('data-vj-who'));
var st=s.getAttribute('data-vj-status')||'',
r=s.getAttribute('data-vj-reason')||'';
var p=document.getElementById('vj-pop-status');
p.textContent=st?(r?st+' \u2014 '+r:st):'';
p.style.display=st?'':'none';
pop.hidden=false;
return;
}
if(e.target===pop||e.target.id==='vj-pop-close')pop.hidden=true;
});
document.addEventListener('keydown',function(e){
if(e.key==='Escape')pop.hidden=true;
if(e.key==='ArrowLeft')show(i-1);
if(e.key==='ArrowRight')show(i+1);
});
})();
</script>
